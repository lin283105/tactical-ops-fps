<!DOCTYPE html>

* { margin: 0; padding: 0; box-sizing: border-box; }

  z-index: 10; pointer-events: all;
}

#overlay .sub { font-size: clamp(11px, 2vw, 16px); color: #888; margin-bottom: 30px; }
#overlay .btn {
  padding: 12px 40px; font-size: 20px; background: #c22; color: #fff; border: 2px solid #e44;

  transition: all 0.2s;
}
#overlay .btn:hover { background: #e44; transform: scale(1.05); }
#overlay .stat { font-size: 18px; color: #ccc; margin: 6px 0; }
#mobile-controls {
  display: none; position: fixed; bottom: 20px; left: 0; width: 100%;
  pointer-events: none; z-index: 5;
}
#shoot-btn {
  position: absolute; bottom: 40px; right: 30px; width: 80px; height: 80px;
  border-radius: 50%; background: rgba(200,30,30,0.6); border: 3px solid rgba(255,80,80,0.9);
  pointer-events: all; display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #fff; font-family: monospace;
}

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Debug: draw a visible border to verify canvas works
function drawDebugBorder() {
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, W - 4, H - 4);
}
// Draw immediately to verify
drawDebugBorder();
console.log('Canvas size:', W, 'x', H, 'Context:', !!ctx);

// ==================== AUDIO ====================
let audioCtx;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { console.warn('Audio init failed:', e); }
}
function playNoise(dur, vol, freq) {
  if (!audioCtx) return;
  try {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * vol;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq || 800;
    filter.Q.value = 0.5;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol * 0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
  } catch(e) {}
}
function playTone(freq, dur, vol, type) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol * 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// ==================== TEXTURES ====================
const TEX_W = 64, TEX_H = 64;
const texData = []; // Pre-extracted pixel data: Uint8ClampedArray per texture

function genTextures() {
  for (let t = 0; t < 5; t++) {
    const tc = document.createElement('canvas');
    tc.width = TEX_W; tc.height = TEX_H;
    const tx = tc.getContext('2d');
    const img = tx.createImageData(TEX_W, TEX_H);
    for (let y = 0; y < TEX_H; y++) {
      for (let x = 0; x < TEX_W; x++) {
        const i = (y * TEX_W + x) * 4;
        let r, g, b;
        if (t === 0) { // Gray stone
          const v = 150 + Math.random() * 50;
          if ((x % 16 < 2) || (y % 16 < 2)) { r=g=b=80; }
          else { r=g=b=v; }
        } else if (t === 1) { // Red brick
          if (y % 16 < 3) { r=100; g=50; b=40; }
          else { r=185+Math.random()*35; g=75+Math.random()*30; b=50+Math.random()*25; }
        } else if (t === 2) { // Blue tech
          r=70+Math.random()*30; g=90+Math.random()*40; b=180+Math.random()*40;
          if ((x+y)%12 < 2) { r+=50; g+=50; b+=50; }
        } else if (t === 3) { // Dark industrial
          r=g=b=80+Math.random()*40;
          if (x%20<2 || y%20<2) { r=g=b=50; }
        } else { // t === 4, gold special
          r=210+Math.random()*35; g=170+Math.random()*30; b=55+Math.random()*30;
          if ((x+y)%10 < 2) { r=g=b=255; }
        }
        img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
      }
    }
    tx.putImageData(img, 0, 0);
    // Pre-extract pixel data so we never call getImageData during rendering
    texData.push(tx.getImageData(0, 0, TEX_W, TEX_H).data);
  }
  console.log('Textures generated:', texData.length);
}
genTextures();

  const sc = document.createElement('canvas');
  sc.width = SPR_W; sc.height = SPR_H;
  const sx = sc.getContext('2d');
  sx.fillStyle = color1;
  sx.fillRect(40, 50, 48, 55);
  sx.fillStyle = color2;
  sx.beginPath(); sx.arc(64, 38, 22, 0, Math.PI*2); sx.fill();
  sx.fillStyle = '#333';
  sx.fillRect(42, 14, 44, 18);
  sx.beginPath(); sx.arc(64, 32, 22, Math.PI, 0); sx.fill();
  sx.fillStyle = '#f00';
  sx.fillRect(54, 34, 6, 4);
  sx.fillRect(68, 34, 6, 4);
  sx.fillStyle = color1;
  sx.fillRect(22, 55, 18, 8);
  sx.fillRect(88, 55, 18, 8);
  sx.fillStyle = '#222';
  sx.fillRect(86, 48, 24, 6);
  sx.fillStyle = '#444';
  sx.fillRect(44, 105, 16, 20);
  sx.fillRect(68, 105, 16, 20);
  return sx.getImageData(0, 0, SPR_W, SPR_H).data;
}

function genPickupData(type) {
  const sc = document.createElement('canvas');

    sx.fillStyle = '#f44';
    sx.fillRect(54, 36, 20, 56);

    sx.fillStyle = '#cc0';
    sx.fillRect(50, 30, 28, 50);
    sx.fillRect(46, 70, 36, 18);
    sx.fillStyle = '#880';
    sx.fillRect(52, 35, 10, 12);
    sx.fillRect(66, 35, 10, 12);
    sx.fillRect(52, 52, 10, 12);
    sx.fillRect(66, 52, 10, 12);
  }
  return sx.getImageData(0, 0, SPR_W, SPR_H).data;
}

// ==================== GAME STATE ====================
let player, enemies, pickups, currentMap, currentLevel;
let keys = {};
let mouseDX = 0;
let gameRunning = false;
let gameOver = false;
let victory = false;
let muzzleFlash = 0;
let damageFlash = 0;
let killCount = 0;
let totalScore = 0;
let messageText = '';
let messageTimer = 0;
let zBuffer = [];
let mobileShoot = false;
let isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);
let animFrameId = null;

let touchMove = false;
let touchStartX = 0, touchStartY = 0;
let touchMoveId = null;

// Wall solid colors (fallback and base colors)
const wallColors = [
  '#999',  // gray stone
  '#c44',  // red brick
  '#48a',  // blue tech

function initLevel(lvl) {

    y: levels[lvl].playerStart.y,

  document.getElementById('death-msg').style.display = 'none';

}

// ==================== INPUT ====================

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => { if (document.pointerLockElement === canvas) mouseDX += e.movementX; });
canvas.addEventListener('click', () => { if (gameRunning && !gameOver && !victory) canvas.requestPointerLock(); });
canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && gameRunning && !gameOver && !victory && document.pointerLockElement === canvas) {
    shoot();
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!gameRunning || gameOver || victory) return;
  for (const t of e.changedTouches) {
    if (t.clientX < W * 0.5) {
      touchMove = true;
      touchMoveId = t.identifier;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    } else {
      mobileShoot = true;
    }
  }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!gameRunning) return;
  for (const t of e.changedTouches) {
    if (t.identifier === touchMoveId && touchMove) {
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      keys['w'] = dy < -15;
      keys['s'] = dy > 15;
      keys['a'] = dx < -15;
      keys['d'] = dx > 15;
    }
    if (t.clientX >= W * 0.5) {
      mouseDX += (t.clientX - touchStartX) * 0.5;
      touchStartX = t.clientX;
    }
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchMoveId) {
      touchMove = false;
      touchMoveId = null;
      keys['w'] = keys['s'] = keys['a'] = keys['d'] = false;
    }
    if (t.clientX >= W * 0.5) mobileShoot = false;
  }
});

// ==================== RAYCASTER ====================
function castRays() {
  zBuffer = new Array(W);
  const fov = Math.PI / 3;
  const fovRatio = Math.tan(fov / 2);
  const dirX = Math.cos(player.angle);
  const dirY = Math.sin(player.angle);
  const planeX = -Math.sin(player.angle) * fovRatio;
  const planeY = Math.cos(player.angle) * fovRatio;

  for (let x = 0; x < W; x++) {
    const cameraX = 2 * x / W - 1;
    const rayDirX = dirX + planeX * cameraX;
    const rayDirY = dirY + planeY * cameraX;

    let mapX = Math.floor(player.x);
    let mapY = Math.floor(player.y);
    const deltaDistX = Math.abs(1 / (rayDirX || 1e-10));
    const deltaDistY = Math.abs(1 / (rayDirY || 1e-10));
    let stepX, stepY, sideDistX, sideDistY;

    if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
    else { stepX = 1; sideDistX = (mapX + 1 - player.x) * deltaDistX; }
    if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
    else { stepY = 1; sideDistY = (mapY + 1 - player.y) * deltaDistY; }

    let side = 0;
    let hit = false;
    for (let i = 0; i < 60; i++) {
      if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
      else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
      if (mapY < 0 || mapY >= currentMap.length || mapX < 0 || mapX >= currentMap[0].length) break;
      if (currentMap[mapY][mapX] > 0) { hit = true; break; }
    }

    let perpDist;
    if (side === 0) perpDist = sideDistX - deltaDistX;
    else perpDist = sideDistY - deltaDistY;
    if (perpDist < 0.01) perpDist = 0.01;

    zBuffer[x] = perpDist;

    const lineH = Math.floor(H / perpDist);
    let drawStart = Math.floor(-lineH / 2 + H / 2);
    let drawEnd = Math.floor(lineH / 2 + H / 2);
    if (drawStart < 0) drawStart = 0;
    if (drawEnd >= H) drawEnd = H - 1;

    // Ceiling
    const skyShade = 0.3 + (drawStart / H) * 0.3;
    const cr = Math.floor(40 + skyShade * 40);
    const cg = Math.floor(40 + skyShade * 40);
    const cb = Math.floor(70 + skyShade * 50);
    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
    ctx.fillRect(x, 0, 1, drawStart);

    // Floor
    ctx.fillStyle = '#5a4a30';
    ctx.fillRect(x, drawEnd, 1, H - drawEnd);

    // Wall
    if (drawEnd > drawStart) {
      // Texture coordinate
      let wallX;
      if (side === 0) wallX = player.y + perpDist * rayDirY;
      else wallX = player.x + perpDist * rayDirX;
      wallX -= Math.floor(wallX);
      let texX = Math.floor(wallX * TEX_W);
      if ((side === 0 && rayDirX > 0) || (side === 1 && rayDirY < 0)) texX = TEX_W - texX - 1;
      texX = Math.max(0, Math.min(TEX_W - 1, texX));

      const wallType = (currentMap[mapY] && currentMap[mapY][mapX]) ? currentMap[mapY][mapX] - 1 : 0;
      const pixels = texData[Math.min(wallType, texData.length - 1)];

      // Pre-calculate shading
      const shade = side === 1 ? 0.7 : 1.0;
      const distFade = 1 / (1 + perpDist * 0.08);
      const totalShade = shade * distFade;

      const step = TEX_H / lineH;
      let texPos = (drawStart - H / 2 + lineH / 2) * step;

      for (let y = drawStart; y < drawEnd; y++) {
        const texY = (Math.floor(texPos) & 63); // fast % TEX_H via bitwise for 64
        texPos += step;
        const pi = (texY * TEX_W + texX) * 4;
        const r = Math.floor(pixels[pi] * totalShade);
        const g = Math.floor(pixels[pi + 1] * totalShade);
        const b = Math.floor(pixels[pi + 2] * totalShade);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
}

// ==================== SPRITE RENDERING ====================
function renderSprites() {
  const sprites = [];

  enemies.forEach((e, i) => {
    if (!e.alive) return;
    const dx = e.x - player.x, dy = e.y - player.y;
    sprites.push({type:'enemy', idx:i, x:e.x, y:e.y, dist:Math.sqrt(dx*dx+dy*dy), hp:e.hp, maxHp:e.maxHp, painTimer:e.painTimer, enemyType:e.type});
  });

  pickups.forEach((p, i) => {
    if (p.collected) return;
    const dx = p.x - player.x, dy = p.y - player.y;
    sprites.push({type:'pickup', idx:i, x:p.x, y:p.y, dist:Math.sqrt(dx*dx+dy*dy), pickupType:p.type});
  });

  sprites.sort((a, b) => b.dist - a.dist);

  const dirX = Math.cos(player.angle);
  const dirY = Math.sin(player.angle);
  const fovRatio = Math.tan(Math.PI / 6);
  const planeX = -Math.sin(player.angle) * fovRatio;
  const planeY = Math.cos(player.angle) * fovRatio;
  const invDet = 1 / (planeX * dirY - dirX * planeY);

  sprites.forEach(sprite => {
    const dx = sprite.x - player.x;
    const dy = sprite.y - player.y;
    const transformX = invDet * (dirY * dx - dirX * dy);
    const transformY = invDet * (-planeY * dx + planeX * dy);
    if (transformY <= 0.1) return;

    const spriteScreenX = Math.floor((W / 2) * (1 + transformX / transformY));
    const spriteH = Math.abs(Math.floor(H / transformY));
    const spriteW = spriteH;

    let drawStartY = Math.max(0, Math.floor(-spriteH / 2 + H / 2));
    let drawEndY = Math.min(H - 1, Math.floor(spriteH / 2 + H / 2));
    let drawStartX = Math.max(0, Math.floor(-spriteW / 2 + spriteScreenX));
    let drawEndX = Math.min(W - 1, Math.floor(spriteW / 2 + spriteScreenX));

    const pixels = sprite.type === 'enemy'
      ? enemyTexData[sprite.enemyType % enemyTexData.length]
      : (sprite.pickupType === 'health' ? pickupTexData[0] : pickupTexData[1]);

    for (let stripe = drawStartX; stripe < drawEndX; stripe++) {
      if (transformY >= zBuffer[stripe]) continue;
      const texX = Math.floor((stripe - (-spriteW / 2 + spriteScreenX)) * SPR_W / spriteW);
      if (texX < 0 || texX >= SPR_W) continue;

      for (let y = drawStartY; y < drawEndY; y++) {
        const texY = Math.floor((y - (-spriteH / 2 + H / 2)) * SPR_H / spriteH);
        if (texY < 0 || texY >= SPR_H) continue;
        const pi = (texY * SPR_W + texX) * 4;
        const a = pixels[pi + 3];
        if (a < 128) continue;
        let pr = pixels[pi], pg = pixels[pi + 1], pb = pixels[pi + 2];

        if (sprite.type === 'enemy' && sprite.painTimer > 0) {
          pr = 255; pg = Math.floor(pg * 0.3); pb = Math.floor(pb * 0.3);
        }

        const fade = 1 / (1 + sprite.dist * 0.06);
        ctx.fillStyle = `rgb(${Math.floor(pr*fade)},${Math.floor(pg*fade)},${Math.floor(pb*fade)})`;
        ctx.fillRect(stripe, y, 1, 1);
      }
    }

    // Enemy health bar
    if (sprite.type === 'enemy' && spriteH > 20) {
      const barW = spriteW * 0.6, barH = 4;
      const barX = spriteScreenX - barW / 2, barY = drawStartY - 8;
      if (barY > 0 && barY < H) {
        ctx.fillStyle = '#300';
        ctx.fillRect(barX, barY, barW, barH);
        const hpRatio = sprite.hp / sprite.maxHp;
        ctx.fillStyle = hpRatio > 0.5 ? '#0a0' : hpRatio > 0.25 ? '#aa0' : '#a00';
        ctx.fillRect(barX, barY, barW * hpRatio, barH);
      }
    }
  });
}

// ==================== HUD ====================
function drawHUD() {
  // Crosshair
  const cx = W/2, cy = H/2, ch = 12;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - ch, cy); ctx.lineTo(cx - 4, cy);
  ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + ch, cy);
  ctx.moveTo(cx, cy - ch); ctx.lineTo(cx, cy - 4);
  ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + ch);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);

  // Health bar
  const hbX = 20, hbY = 20, hbW = 200, hbH = 18;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4);
  ctx.fillStyle = '#400';
  ctx.fillRect(hbX, hbY, hbW, hbH);
  const hpRatio = player.health / player.maxHealth;
  ctx.fillStyle = hpRatio > 0.5 ? '#4a4' : hpRatio > 0.25 ? '#aa4' : '#a44';
  ctx.fillRect(hbX, hbY, hbW * hpRatio, hbH);
  ctx.fillStyle = '#fff';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText('HP: ' + Math.ceil(player.health), hbX + 6, hbY + 14);

  // Ammo
  const amX = W - 170, amY = 20;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(amX - 2, amY - 2, 154, 24);
  ctx.fillStyle = '#fff';
  ctx.font = '15px "Courier New", monospace';
  ctx.fillText('弹药: ' + player.ammo + ' / ' + player.maxAmmo, amX + 4, amY + 17);

  // Score (center top)
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(W/2 - 60, 8, 120, 26);
  ctx.fillStyle = '#ff0';
  ctx.font = '15px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('得分: ' + player.score, W/2, 28);
  ctx.textAlign = 'start';

  // Level & enemies
  ctx.fillStyle = '#aaa';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('关卡 ' + (currentLevel + 1), W/2 - 28, 50);
  const alive = enemies.filter(e => e.alive).length;
  ctx.fillStyle = '#faa';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText('剩余敌人: ' + alive, 20, 58);

  // Message
  if (messageTimer > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, messageTimer) + ')';
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(messageText, W/2, H/2 - 60);
    ctx.textAlign = 'start';
  }

  // Damage flash
  if (damageFlash > 0) {
    ctx.fillStyle = 'rgba(255,0,0,' + (damageFlash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // Weapon
  drawWeapon();

  // Minimap
  drawMinimap();

  // Debug border
  drawDebugBorder();
}

function drawWeapon() {
  const cx = W/2, by = H;
  ctx.fillStyle = '#444';
  ctx.fillRect(cx - 8, by - 100, 16, 90);
  ctx.fillStyle = '#666';
  ctx.fillRect(cx - 6, by - 110, 12, 20);
  ctx.fillStyle = '#333';
  ctx.fillRect(cx - 3, by - 140, 6, 35);
  ctx.fillStyle = '#5a4528';
  ctx.fillRect(cx - 6, by - 40, 14, 35);
  ctx.fillRect(cx + 4, by - 55, 20, 10);

  if (muzzleFlash > 0) {
    const grad = ctx.createRadialGradient(cx, by - 140, 2, cx, by - 140, 30);
    grad.addColorStop(0, 'rgba(255,255,200,' + muzzleFlash + ')');
    grad.addColorStop(0.3, 'rgba(255,200,50,' + (muzzleFlash * 0.7) + ')');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - 30, by - 170, 60, 60);
  }
}

function drawMinimap() {
  const ms = 8;
  const mw = currentMap[0].length * ms;
  const mh = currentMap.length * ms;
  const mx = 10, my = H - mh - 12;

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);

  for (let y = 0; y < currentMap.length; y++) {
    for (let x = 0; x < currentMap[0].length; x++) {
      ctx.fillStyle = currentMap[y][x] > 0 ? '#555' : '#222';
      ctx.fillRect(mx + x * ms, my + y * ms, ms, ms);
    }
  }

  enemies.forEach(e => {
    if (!e.alive) return;
    ctx.fillStyle = '#f44';
    ctx.fillRect(mx + e.x * ms - 1, my + e.y * ms - 1, 3, 3);
  });

  const px = mx + player.x * ms;
  const py = my + player.y * ms;
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle) * 10, py + Math.sin(player.angle) * 10);
  ctx.stroke();
}

// ==================== GAME LOGIC ====================
function shoot() {
  if (player.ammo <= 0) { playTone(200, 0.15, 0.3, 'square'); return; }
  player.ammo--;
  muzzleFlash = 1;
  playNoise(0.15, 0.6, 400);

  let bestIdx = -1, bestDist = Infinity;
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const fovRatio = Math.tan(Math.PI / 6);
  const planeX = -Math.sin(player.angle) * fovRatio;
  const planeY = Math.cos(player.angle) * fovRatio;
  const invDet = 1 / (planeX * dirY - dirX * planeY);

  enemies.forEach((e, i) => {
    if (!e.alive) return;
    const dx = e.x - player.x, dy = e.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 20) return;
    const tx = invDet * (dirY * dx - dirX * dy);
    const ty = invDet * (-planeY * dx + planeX * dy);
    if (ty <= 0.1) return;
    const sx = (W / 2) * (1 + tx / ty);
    const sh = Math.abs(H / ty);
    if (Math.abs(sx - W/2) < sh * 0.25 && ty < zBuffer[Math.floor(W/2)] && dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  });

  if (bestIdx >= 0) {
    const e = enemies[bestIdx];
    const dmg = 25 + Math.floor(Math.random() * 15);
    e.hp -= dmg;
    e.painTimer = 0.3;
    playTone(600, 0.1, 0.4, 'square');
    if (e.hp <= 0) {
      e.alive = false;
      killCount++;
      player.score += 100;
      totalScore = player.score;
      playTone(300, 0.2, 0.5, 'sawtooth');
      showMessage('击杀! +100');
      checkLevelComplete();
    }
  }
}

function showMessage(msg) { messageText = msg; messageTimer = 1.5; }

function checkLevelComplete() {
  if (enemies.filter(e => e.alive).length === 0) {
    player.score += 200;
    totalScore = player.score;
    showMessage('区域已清除! +200');
    setTimeout(() => {
      if (currentLevel + 1 < levels.length) {
        initLevel(currentLevel + 1);
        totalScore = player.score;
        showMessage('第 ' + (currentLevel + 1) + ' 关');
      } else {
        victory = true;
        gameRunning = false;
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('win-msg').style.display = 'block';
        document.getElementById('win-score').textContent = '最终得分: ' + totalScore + ' | 击杀: ' + killCount;
        document.exitPointerLock();
      }
    }, 1500);
  }
}

function playerHit(dmg) {
  player.health -= dmg;
  damageFlash = 0.5;
  playTone(100, 0.2, 0.5, 'sawtooth');
  if (player.health <= 0) {
    player.health = 0;
    gameOver = true;
    gameRunning = false;
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('death-msg').style.display = 'block';
    document.getElementById('final-score').textContent = '最终得分: ' + totalScore + ' | 击杀: ' + killCount;
    document.exitPointerLock();
  }
}

function reload() {
  if (player.ammo >= player.maxAmmo) return;
  player.ammo = player.maxAmmo;
  playTone(800, 0.1, 0.3, 'square');
  setTimeout(() => playTone(1000, 0.1, 0.3, 'square'), 100);
  showMessage('换弹完成');
}

// ==================== UPDATE ====================
function update(dt) {
  if (!gameRunning || gameOver || victory) return;
  const cappedDt = Math.min(dt, 0.1);

  player.angle += mouseDX * 0.003;
  mouseDX = 0;

  const moveSpeed = 3.5 * cappedDt;
  const rotSpeed = 3 * cappedDt;
  if (keys['arrowleft'] || keys['q']) player.angle -= rotSpeed;
  if (keys['arrowright'] || keys['e']) player.angle += rotSpeed;

  let moveX = 0, moveY = 0;
  if (keys['w'] || keys['arrowup']) { moveX += Math.cos(player.angle) * moveSpeed; moveY += Math.sin(player.angle) * moveSpeed; }
  if (keys['s'] || keys['arrowdown']) { moveX -= Math.cos(player.angle) * moveSpeed; moveY -= Math.sin(player.angle) * moveSpeed; }
  if (keys['a']) { moveX += Math.cos(player.angle - Math.PI/2) * moveSpeed; moveY += Math.sin(player.angle - Math.PI/2) * moveSpeed; }
  if (keys['d']) { moveX += Math.cos(player.angle + Math.PI/2) * moveSpeed; moveY += Math.sin(player.angle + Math.PI/2) * moveSpeed; }

  const m = 0.25;
  const nx = player.x + moveX, ny = player.y + moveY;
  if (!isWall(nx + m, player.y) && !isWall(nx - m, player.y) &&
      !isWall(nx + m, player.y + m) && !isWall(nx - m, player.y - m)) player.x = nx;
  if (!isWall(player.x, ny + m) && !isWall(player.x, ny - m) &&
      !isWall(player.x + m, ny + m) && !isWall(player.x - m, ny - m)) player.y = ny;

  // Shoot
  if (keys[' '] || keys['j'] || mobileShoot) {
    if (!keys['_shot']) { keys['_shot'] = true; shoot(); }
  } else { keys['_shot'] = false; }

  // Reload
  if (keys['r']) {
    if (!keys['_reload']) { keys['_reload'] = true; reload(); }
  } else { keys['_reload'] = false; }

  muzzleFlash = Math.max(0, muzzleFlash - cappedDt * 8);
  damageFlash = Math.max(0, damageFlash - cappedDt * 2);
  messageTimer = Math.max(0, messageTimer - cappedDt);

  // Enemy AI
  enemies.forEach(e => {
    if (!e.alive) return;
    e.painTimer = Math.max(0, e.painTimer - cappedDt);
    e.attackCooldown = Math.max(0, e.attackCooldown - cappedDt);

    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 15 && hasLOS(e.x, e.y, player.x, player.y)) {
      e.seePlayer = true;
      if (dist > 1.5) {
        const spd = 1.5 * cappedDt;
        const nx = e.x + (dx / dist) * spd;
        const ny = e.y + (dy / dist) * spd;
        if (!isWall(nx, e.y) && !enemyCollision(nx, e.y, e)) e.x = nx;
        if (!isWall(e.x, ny) && !enemyCollision(e.x, ny, e)) e.y = ny;
      }
      if (dist < 2 && e.attackCooldown <= 0) {
        e.attackCooldown = 1.2;
        playerHit(8 + Math.floor(Math.random() * 6));
      }
    } else {
      e.seePlayer = false;
    }
  });

  // Pickups
  pickups.forEach(p => {
    if (p.collected) return;
    const d = Math.hypot(player.x - p.x, player.y - p.y);
    if (d < 1) {
      p.collected = true;
      if (p.type === 'health') {
        player.health = Math.min(player.maxHealth, player.health + 25);
        showMessage('+25 HP');
        playTone(500, 0.1, 0.3, 'sine');
        setTimeout(() => playTone(700, 0.1, 0.3, 'sine'), 100);
      } else {
        player.ammo = Math.min(player.maxAmmo, player.ammo + 10);
        showMessage('+10 弹药');
        playTone(600, 0.1, 0.3, 'sine');
        setTimeout(() => playTone(900, 0.1, 0.3, 'sine'), 100);
      }
    }
  });

  if (player.ammo <= 0 && !keys['_reload']) reload();
}

function isWall(x, y) {
  const mx = Math.floor(x), my = Math.floor(y);
  if (my < 0 || my >= currentMap.length || mx < 0 || mx >= currentMap[0].length) return true;
  return currentMap[my][mx] > 0;
}

function enemyCollision(x, y, self) {
  for (const e of enemies) {
    if (e === self || !e.alive) continue;
    if (Math.abs(e.x - x) < 0.3 && Math.abs(e.y - y) < 0.3) return true;
  }
  return false;
}

function hasLOS(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const steps = Math.ceil(dist * 4);
  for (let i = 0; i <= steps; i++) {
    if (isWall(x1 + dx * i / steps, y1 + dy * i / steps)) return false;
  }
  return true;
}

// ==================== GAME LOOP ====================
let lastTime = 0;
let frameCount = 0;
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  if (dt <= 0) dt = 0.016;
  lastTime = timestamp;

  if (gameRunning && !gameOver && !victory) {
    try {
      update(dt);
    } catch(e) { console.error('Update error:', e); }

    ctx.clearRect(0, 0, W, H);

    try {
      castRays();
    } catch(e) {
      console.error('castRays error:', e);
      // Solid color fallback
      ctx.fillStyle = '#833';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText('Render error - check console', 20, 40);
    }

    try { renderSprites(); } catch(e) { console.error('Sprites error:', e); }
    try { drawHUD(); } catch(e) { console.error('HUD error:', e); }

    frameCount++;
    if (frameCount === 1) {
      console.log('First frame rendered. W:', W, 'H:', H, 'player:', player.x, player.y, 'angle:', player.angle);
      console.log('zBuffer sample:', zBuffer[Math.floor(W/2)]);
    }
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ==================== INIT ====================
window.startGame = startGame;
document.getElementById('overlay').style.display = 'flex';
if (isMobile) {
  document.querySelector('.sub').textContent = '左侧移动 | 右侧旋转视角 | 点击射击按钮';
}
console.log('Tactical Ops FPS ready. Levels:', levels.length);
console.log('Textures pre-extracted:', texData.length, 'wall,', enemyTexData.length, 'enemy,', pickupTexData.length, 'pickup');

// Start loop (renders nothing until gameRunning is true)
animFrameId = requestAnimationFrame(gameLoop);
</script>
